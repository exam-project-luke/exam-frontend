<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DronePizza Delivery Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <meta name="description" content="Manage DronePizza deliveries with this interactive tool.">
    <script defer type="module" src="js/app.js"></script>
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center mb-4">DronePizza Delivery Management</h1>
    <div class="row">
        <div class="col-md-12">
            <button id="createDroneBtn" class="btn btn-primary mb-3" aria-label="Create a new drone">Create New Drone</button>
            <h3>Pending Deliveries</h3>
            <ul id="deliveryList" class="list-group">
            </ul>
        </div>
    </div>
    <div class="container mt-4">
        <div class ="row">
            <button id="createDeliveryBtn" class="btn btn-primary mb-3" aria-label="Create a new Delivery">Create New Delivery</button>
        </div>
    </div>
</div>
</body>
</html>
